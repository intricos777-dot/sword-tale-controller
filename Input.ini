# Watermark: Living_Sin (intricos777-dot) + AI agents (Hermes, Lia, opencode) - collaborative work
; ============================================================================
; Sword Tale : Lost Excalibur (Steam 3305630) — controller remap (UE4 Input.ini)
; ============================================================================
; Layout (Xbox/Steam Input labels):
;   LT =  Block / Defend          RT =  Attack
;   LB =  Dodge                   RB =  Charge (heavy)
;   D-pad Up/Down/Left/Right =    Slot1 / Slot2 / Slot3 / Slot4
;   Select/Back (Special_Left) =  Slot5
;   A = Jump   B = Interact   X = Inventory   Y = Sprint
;   L3 (click) = WeaponToggle    R3 (click) = SkillTree
;   Start (Special_Right) = Pause
; ============================================================================
; These lines apply on top of the game's built-in DefaultInput.ini inside the
; .pak: "-" lines REMOVE the game's gamepad default for a key, "+" lines ADD
; our new binding. Keyboard bindings are left untouched.
; ============================================================================

[/Script/Engine.InputSettings]

; ---- Attack: RIGHT TRIGGER (was: X / Gamepad_FaceButton_Left) ----
-ActionMappings=(ActionName="Attack",Key=Gamepad_FaceButton_Left,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Attack",Key=Gamepad_RightTrigger,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Block / Defend: LEFT TRIGGER (was: RB / Gamepad_RightShoulder) ----
-ActionMappings=(ActionName="Block",Key=Gamepad_RightShoulder,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Block",Key=Gamepad_LeftTrigger,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Charge (heavy): RIGHT SHOULDER (was: LT / Gamepad_LeftTrigger) ----
-ActionMappings=(ActionName="Charge",Key=Gamepad_LeftTrigger,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Charge",Key=Gamepad_RightShoulder,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Dodge: LEFT SHOULDER (was: RT / Gamepad_RightTrigger) ----
-ActionMappings=(ActionName="Dodge",Key=Gamepad_RightTrigger,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Dodge",Key=Gamepad_LeftShoulder,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Inventory: X (was: Select / Gamepad_Special_Left, now used by Slot5) ----
-ActionMappings=(ActionName="Inventory",Key=Gamepad_Special_Left,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Inventory",Key=Gamepad_FaceButton_Left,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- WeaponToggle: LEFT STICK CLICK / L3 (was: LB / Gamepad_LeftShoulder) ----
-ActionMappings=(ActionName="WeaponToggle",Key=Gamepad_LeftShoulder,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="WeaponToggle",Key=Gamepad_LeftThumbstick,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- SkillTree: RIGHT STICK CLICK / R3 (keyboard K kept) ----
+ActionMappings=(ActionName="SkillTree",Key=Gamepad_RightThumbstick,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Item slots 1-4: D-PAD ----
+ActionMappings=(ActionName="Slot1",Key=Gamepad_DPad_Up,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Slot2",Key=Gamepad_DPad_Down,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Slot3",Key=Gamepad_DPad_Left,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Slot4",Key=Gamepad_DPad_Right,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Item slot 5: SELECT / BACK ----
+ActionMappings=(ActionName="Slot5",Key=Gamepad_Special_Left,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

; ---- Unchanged defaults kept for reference ----
; Jump        = Gamepad_FaceButton_Bottom (A)
; Interact    = Gamepad_FaceButton_Right  (B)
; Sprint      = Gamepad_FaceButton_Top    (Y)
; PauseMenu   = Gamepad_Special_Right     (Start)
; Move (axes) = Left stick, camera = right stick (game defaults)